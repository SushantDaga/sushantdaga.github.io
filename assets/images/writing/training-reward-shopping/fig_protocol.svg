<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#188038"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#202124">The five-step protocol: shop for a training reward on your own data</text>

  <!-- Step 1 -->
  <rect x="30" y="90" width="260" height="150" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <circle cx="55" cy="105" r="13" fill="#1a73e8"/>
  <text x="55" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text x="160" y="122" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#202124">Count your checker's</text>
  <text x="160" y="139" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#202124">silence</text>
  <text x="160" y="164" text-anchor="middle" font-size="11.5" fill="#202124">Output: fraction of dead groups —</text>
  <text x="160" y="180" text-anchor="middle" font-size="11.5" fill="#202124">a ceiling on how much a reward</text>
  <text x="160" y="196" text-anchor="middle" font-size="11.5" fill="#202124">model could possibly help</text>
  <text x="160" y="220" text-anchor="middle" font-size="11.5" fill="#188038">Cost: free — reuse rollouts you</text>
  <text x="160" y="234" text-anchor="middle" font-size="11.5" fill="#188038">already generate</text>

  <!-- Step 2 -->
  <rect x="320" y="90" width="260" height="150" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <circle cx="345" cy="105" r="13" fill="#1a73e8"/>
  <text x="345" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text x="450" y="122" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#202124">Grade your own rollouts,</text>
  <text x="450" y="139" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#202124">not the leaderboard's</text>
  <text x="450" y="164" text-anchor="middle" font-size="11.5" fill="#202124">Output: resolution — does it rank</text>
  <text x="450" y="180" text-anchor="middle" font-size="11.5" fill="#202124">correct above incorrect within a</text>
  <text x="450" y="196" text-anchor="middle" font-size="11.5" fill="#202124">group, on YOUR rollouts</text>
  <text x="450" y="220" text-anchor="middle" font-size="11.5" fill="#188038">Cost: also close to free — labels</text>
  <text x="450" y="234" text-anchor="middle" font-size="11.5" fill="#188038">you likely already have</text>

  <!-- Step 3 -->
  <rect x="610" y="90" width="260" height="150" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <circle cx="635" cy="105" r="13" fill="#1a73e8"/>
  <text x="635" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text x="740" y="122" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#202124">Measure the reward's own</text>
  <text x="740" y="139" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#202124">wobble before trusting a gap</text>
  <text x="740" y="164" text-anchor="middle" font-size="11.5" fill="#202124">Output: the reward model's own</text>
  <text x="740" y="180" text-anchor="middle" font-size="11.5" fill="#202124">noise floor — score the same</text>
  <text x="740" y="196" text-anchor="middle" font-size="11.5" fill="#202124">unchanged answer more than once</text>
  <text x="740" y="220" text-anchor="middle" font-size="11.5" fill="#188038">Cost: a few dozen extra scoring</text>
  <text x="740" y="234" text-anchor="middle" font-size="11.5" fill="#188038">calls</text>

  <!-- Step 4 -->
  <rect x="175" y="345" width="260" height="150" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <circle cx="200" cy="360" r="13" fill="#1a73e8"/>
  <text x="200" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
  <text x="305" y="377" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#202124">Buy the cheapest one</text>
  <text x="305" y="394" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#202124">that clears</text>
  <text x="305" y="419" text-anchor="middle" font-size="11.5" fill="#202124">Output: the cheapest candidate</text>
  <text x="305" y="435" text-anchor="middle" font-size="11.5" fill="#202124">clearing step 2's resolution bar</text>
  <text x="305" y="451" text-anchor="middle" font-size="11.5" fill="#202124">over step 3's noise floor</text>
  <text x="305" y="475" text-anchor="middle" font-size="11.5" fill="#5f6368">Cost: none beyond steps 1-3 —</text>
  <text x="305" y="489" text-anchor="middle" font-size="11.5" fill="#5f6368">a decision, not a spend</text>

  <!-- Step 5 -->
  <rect x="465" y="345" width="260" height="150" rx="8" fill="#ffffff" stroke="#188038" stroke-width="2.5"/>
  <circle cx="490" cy="360" r="13" fill="#188038"/>
  <text x="490" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
  <text x="595" y="377" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#188038">Pilot it as a tie-break,</text>
  <text x="595" y="394" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#188038">read the result in pairs</text>
  <text x="595" y="419" text-anchor="middle" font-size="11.5" fill="#202124">Output: a paired verdict — tie-</text>
  <text x="595" y="435" text-anchor="middle" font-size="11.5" fill="#202124">break vs. checker-only, same</text>
  <text x="595" y="451" text-anchor="middle" font-size="11.5" fill="#202124">questions, same eval set</text>
  <text x="595" y="475" text-anchor="middle" font-size="11.5" fill="#188038">Cost: the real spend — one</text>
  <text x="595" y="489" text-anchor="middle" font-size="11.5" fill="#188038">short pilot training arm</text>

  <!-- Arrows: 1 -> 2 -> 3 (top row) -->
  <line x1="290" y1="165" x2="317" y2="165" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrowGrey)"/>
  <line x1="580" y1="165" x2="607" y2="165" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrowGrey)"/>

  <!-- Arrow: 3 -> 4 (elbow, top row to bottom row) -->
  <polyline points="740,240 740,300 305,300 305,342" fill="none" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrowGrey)"/>

  <!-- Arrow: 4 -> 5 (bottom row) -->
  <line x1="435" y1="420" x2="462" y2="420" stroke="#188038" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <text x="450" y="535" text-anchor="middle" font-size="11" fill="#9aa0a6">Steps 1-4 measure your own setup first; step 5 is the only step that spends a training budget.</text>
</svg>
