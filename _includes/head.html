<head>
  <meta charset="UTF-8">
  <title>{% if page.title and page.layout != "home" %}{{ page.title }} · {% endif %}{{ site.title }}{% if page.layout == "home" %} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  {%- assign og_title = page.title | default: site.title -%}
  {%- if page.layout == "home" %}{% assign og_title = site.title | append: " · " | append: site.tagline %}{% endif %}
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/photo.jpg' | absolute_url }}">
  <meta property="og:image:width" content="1080">
  <meta property="og:image:height" content="1080">
  <meta property="og:image:alt" content="Portrait of Sushant Daga">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@{{ site.author.x }}">
  {%- if page.layout == "home" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Sushant Daga",
    "url": "{{ site.url }}/",
    "image": "{{ '/assets/images/photo.jpg' | absolute_url }}",
    "jobTitle": "Founder",
    "worksFor": { "@type": "Organization", "name": "Biclay", "url": "{{ site.links.biclay }}" },
    "sameAs": [
      "https://github.com/{{ site.author.github }}",
      "https://www.linkedin.com/in/{{ site.author.linkedin }}/",
      "https://x.com/{{ site.author.x }}",
      "{{ site.links.biclay }}",
      "{{ site.links.citeonly }}"
    ]
  }
  </script>
  {%- endif %}
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  {% if page.math %}
  <!-- kramdown's math_engine wraps math as \(...\) / \[...\], which MathJax recognizes by default -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>
  {% endif %}
</head>
